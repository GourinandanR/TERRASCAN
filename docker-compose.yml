services:
  api:
    build:
      context: ./backend
    container_name: terrascan-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TERRASCAN_DB_PATH: /app/data/terrascan.sqlite3
      TERRASCAN_AUTH_REQUIRED: ${TERRASCAN_AUTH_REQUIRED:-false}
      TERRASCAN_USER_AUTH_REQUIRED: ${TERRASCAN_USER_AUTH_REQUIRED:-true}
    ports:
      - "8000:8000"
    volumes:
      - terrascan-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  terrascan-data:
